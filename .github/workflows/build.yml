name: Build Protocol package

on:
  push:
    branches: [main]
    paths:
      - "component/**"
      - "package/**"
      - "updates/**"
      - "tests/**"
      - "tools/build.php"
      - "VERSION"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(php -r '$x=simplexml_load_file("package/pkg_decaroprotocol.xml"); echo trim((string)$x->version);')"
          test -n "$VERSION"
          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate PHP XML JSON schema and integration boundaries
        shell: bash
        run: |
          set -euo pipefail
          find component tools tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          while IFS= read -r -d '' FILE; do
            php -r 'libxml_use_internal_errors(true); if (simplexml_load_file($argv[1]) === false) { fwrite(STDERR, "XML non valido: {$argv[1]}\n"); exit(1); }' "$FILE"
          done < <(find component package updates -type f -name '*.xml' -print0)
          VERSION="${{ steps.version.outputs.version }}"
          php -r '$data=json_decode(file_get_contents("component/media/joomla.asset.json"), true); if (!is_array($data) || json_last_error() !== JSON_ERROR_NONE || ($data["version"] ?? "") !== $argv[1]) { exit(1); }' "$VERSION"
          php -r '$x=simplexml_load_file("updates/pkg_decaroprotocol.xml"); if (!$x || trim((string)$x->update->version) !== $argv[1]) { exit(1); }' "$VERSION"
          grep -F 'updates/pkg_decaroprotocol.xml' package/pkg_decaroprotocol.xml
          test -f "component/admin/sql/updates/mysql/${VERSION}.sql"
          grep -F 'charset="utf8"' component/decaroprotocol.xml
          ! grep -F 'charset="utf8mb4"' component/decaroprotocol.xml
          for table in registers register_counters records audit; do
            grep -F "CREATE TABLE IF NOT EXISTS \`#__decaroprotocol_${table}\`" "component/admin/sql/updates/mysql/${VERSION}.sql"
          done
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql/updates/mysql
          test -f component/admin/src/Service/CoreIntegrationService.php
          test -f component/admin/src/Service/DocumentsIntegrationService.php
          test -f component/admin/src/Helper/InformationHelper.php
          grep -F 'xdecaro\Core' component/admin/src/Service/CoreIntegrationService.php
          grep -F 'xdecaro\Core' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'xdecaro\Core' component/admin/src/Helper/InformationHelper.php
          ! grep -RInF 'Xdecaro\Core' component/admin/src component/admin/services
          grep -F "MINIMUM_CORE_VERSION = '1.3.0'" component/admin/src/Service/CoreIntegrationService.php
          grep -F "MINIMUM_CORE = '1.3.0'" component/admin/src/Helper/InformationHelper.php
          grep -F "VERSION = '${VERSION}'" component/admin/src/Helper/InformationHelper.php
          grep -F "'Competitions' => 'com_xdecarocompetitions'" component/admin/src/Helper/InformationHelper.php
          ! grep -RInF 'com_decarodcl' component
          ! grep -RInF '#__decarodocuments_' component
          grep -F 'bootComponent(self::DOCUMENTS_COMPONENT)' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'getRelationService' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'assertRecordRelationsMutable' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F "Session::checkToken('post')" component/admin/src/Controller/RecordController.php
          grep -F 'task=record.attachDocument' component/admin/tmpl/record/edit.php
          grep -F 'task=record.detachDocument' component/admin/tmpl/record/edit.php
          php tests/documents-integration-contract.php
      - name: Deterministic build A
        run: php tools/build.php && cp dist/SHA256SUMS.txt /tmp/protocol-sums
      - name: Deterministic build B and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          php tools/build.php
          diff -u /tmp/protocol-sums dist/SHA256SUMS.txt
          VERSION="${{ steps.version.outputs.version }}"
          C="dist/com_decaroprotocol_${VERSION}.zip"
          P="dist/pkg_decaroprotocol_${VERSION}.zip"
          unzip -t "$C" >/dev/null
          unzip -t "$P" >/dev/null
          unzip -p "$C" decaroprotocol.xml | grep -F "<version>${VERSION}</version>"
          unzip -p "$C" decaroprotocol.xml | grep -F 'charset="utf8"'
          unzip -p "$P" pkg_decaroprotocol.xml | grep -F "<version>${VERSION}</version>"
          unzip -l "$C" | grep -F "admin/sql/updates/mysql/${VERSION}.sql"
          unzip -l "$C" | grep -F 'admin/src/Service/DocumentsIntegrationService.php'
      - name: Upload Joomla packages
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: decaroprotocol-${{ steps.version.outputs.version }}
          path: dist/

  joomla-integration:
    name: Joomla ${{ matrix.joomla }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5.4.8', '6.1.3']
        mode: ['clean', 'repair-1.2.0']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, simplexml
          coverage: none
      - name: Build Protocol package
        run: php tools/build.php
      - name: Download and verify runtime packages
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='${{ matrix.joomla }}'
          case "$JOOMLA" in
            5.4.8) JSHA='8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0' ;;
            6.1.3) JSHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1' ;;
            *) exit 1 ;;
          esac
          JFILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          curl -fL --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${JFILE}" -o /tmp/joomla.zip
          echo "${JSHA}  /tmp/joomla.zip" | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict
          curl -fL --retry 3 'https://github.com/xdecaro/documents/releases/download/v1.2.2/pkg_decarodocuments_1.2.2.zip' -o /tmp/documents.zip
          echo '0b82aef86ffd094cc2453e129e285bfb6274d08c930453a519fbf876e641114f  /tmp/documents.zip' | sha256sum --check --strict
          if [ '${{ matrix.mode }}' = 'repair-1.2.0' ]; then
            curl -fL --retry 3 'https://github.com/xdecaro/protocol/releases/download/v1.2.0/pkg_decaroprotocol_1.2.0.zip' -o /tmp/protocol-old.zip
            echo '8dbc5cd43622d65d4f5aa260c070a52975d012117f595c8de4d938c2b08491a3  /tmp/protocol-old.zip' | sha256sum --check --strict
          fi
          mkdir joomla && unzip -q /tmp/joomla.zip -d joomla
      - name: Install Joomla Core and Documents
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install --site-name='Protocol integration CI' --admin-user='Protocol CI Admin' --admin-username=admin --admin-password="ProtocolCI-${GITHUB_RUN_ID}!" --admin-email=admin@example.invalid --db-type=mysqli --db-host=127.0.0.1 --db-user=root --db-pass='' --db-name=joomla --db-prefix=prt_ --db-encryption=0 --no-interaction
          php cli/joomla.php extension:install --path=/tmp/core.zip -vvv
          php cli/joomla.php extension:install --path=/tmp/documents.zip -vvv
      - name: Install or repair Protocol
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          if [ '${{ matrix.mode }}' = 'repair-1.2.0' ]; then
            php cli/joomla.php extension:install --path=/tmp/protocol-old.zip -vvv
            BEFORE="$(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='prt_decaroprotocol_records';")"
            echo "protocol_records_before_repair=${BEFORE}"
          fi
          VERSION="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/VERSION")"
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_decaroprotocol_${VERSION}.zip" -vvv
      - name: Verify installed integration boundary and schemas
        shell: bash
        run: |
          set -euo pipefail
          MYSQL=(mysql --protocol=TCP -h127.0.0.1 -uroot --batch --skip-column-names joomla)
          for table in prt_decarodocuments_documents prt_decarodocuments_relations prt_decaroprotocol_registers prt_decaroprotocol_register_counters prt_decaroprotocol_records prt_decaroprotocol_audit; do
            count="$("${MYSQL[@]}" -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='joomla' AND table_name='${table}';")"
            echo "${table}=${count}"
            test "$count" = '1'
          done
          d_schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM prt_schemas s JOIN prt_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decarodocuments' LIMIT 1;")"
          p_schema="$("${MYSQL[@]}" -e "SELECT s.version_id FROM prt_schemas s JOIN prt_extensions e ON e.extension_id=s.extension_id WHERE e.type='component' AND e.element='com_decaroprotocol' LIMIT 1;")"
          echo "documents_schema=${d_schema} protocol_schema=${p_schema}"
          test "$d_schema" = '1.2.2'
          test "$p_schema" = '1.4.0'
          SERVICE='joomla/administrator/components/com_decaroprotocol/src/Service/DocumentsIntegrationService.php'
          test -f "$SERVICE"
          grep -F 'bootComponent(self::DOCUMENTS_COMPONENT)' "$SERVICE"
          grep -F 'getRelationService' "$SERVICE"
          grep -F 'assertRecordRelationsMutable' "$SERVICE"
          ! grep -F '#__decarodocuments_' "$SERVICE"
      - name: Exercise Protocol Documents relation runtime
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > protocol-documents-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          use Joomla\CMS\Factory;
          use Joomla\CMS\User\UserFactoryInterface;
          use Joomla\Database\DatabaseInterface;
          use Xdecaro\Component\Decaroprotocol\Administrator\Service\CoreIntegrationService;
          use Xdecaro\Component\Decaroprotocol\Administrator\Service\DocumentsIntegrationService;

          $container = Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          /** @var DatabaseInterface $db */
          $db = $container->get(DatabaseInterface::class);
          $userQuery = $db->getQuery(true)
              ->select($db->quoteName('id'))
              ->from($db->quoteName('#__users'))
              ->where($db->quoteName('username') . ' = ' . $db->quote('admin'));
          $userId = (int) $db->setQuery($userQuery, 0, 1)->loadResult();
          if ($userId < 1) {
              throw new RuntimeException('Runtime admin user was not found.');
          }
          $user = $container->get(UserFactoryInterface::class)->loadUserById($userId);
          $app->loadIdentity($user);

          $registerQuery = $db->getQuery(true)
              ->select($db->quoteName('id'))
              ->from($db->quoteName('#__decaroprotocol_registers'))
              ->order($db->quoteName('id') . ' ASC');
          $registerId = (int) $db->setQuery($registerQuery, 0, 1)->loadResult();
          if ($registerId < 1) {
              throw new RuntimeException('Protocol register was not found.');
          }

          $now = Factory::getDate()->toSql();
          $recordInsert = $db->getQuery(true)
              ->insert($db->quoteName('#__decaroprotocol_records'))
              ->columns([
                  $db->quoteName('register_id'),
                  $db->quoteName('subject'),
                  $db->quoteName('status'),
                  $db->quoteName('created'),
                  $db->quoteName('created_by'),
              ])
              ->values(implode(',', [
                  (string) $registerId,
                  $db->quote('Protocol Documents runtime probe'),
                  $db->quote('draft'),
                  $db->quote($now),
                  (string) $userId,
              ]));
          $db->setQuery($recordInsert)->execute();
          $recordId = (int) $db->insertid();

          $documentInsert = $db->getQuery(true)
              ->insert($db->quoteName('#__decarodocuments_documents'))
              ->columns([
                  $db->quoteName('uuid'),
                  $db->quoteName('title'),
                  $db->quoteName('original_name'),
                  $db->quoteName('mime_type'),
                  $db->quoteName('file_size'),
                  $db->quoteName('sha256'),
                  $db->quoteName('state'),
                  $db->quoteName('access'),
                  $db->quoteName('created'),
                  $db->quoteName('created_by'),
              ])
              ->values(implode(',', [
                  $db->quote('11111111-1111-4111-8111-111111111111'),
                  $db->quote('Protocol runtime attachment'),
                  $db->quote('runtime.txt'),
                  $db->quote('text/plain'),
                  '12',
                  $db->quote(str_repeat('a', 64)),
                  '1',
                  '1',
                  $db->quote($now),
                  (string) $userId,
              ]));
          $db->setQuery($documentInsert)->execute();
          $documentId = (int) $db->insertid();

          $service = new DocumentsIntegrationService(new CoreIntegrationService(), $db);
          if (!$service->isAvailable()) {
              throw new RuntimeException('Protocol Documents integration is not available at runtime.');
          }

          $service->attachDocumentToRecord($documentId, $recordId);
          $documents = $service->findDocumentsForRecord($recordId);
          if (count($documents) !== 1 || (int) ($documents[0]['id'] ?? 0) !== $documentId) {
              throw new RuntimeException('Draft attachment was not returned by Documents public relation API.');
          }

          $protocolled = $db->getQuery(true)
              ->update($db->quoteName('#__decaroprotocol_records'))
              ->set($db->quoteName('status') . ' = ' . $db->quote('protocolled'))
              ->where($db->quoteName('id') . ' = ' . $recordId);
          $db->setQuery($protocolled)->execute();

          $documents = $service->findDocumentsForRecord($recordId);
          if (count($documents) !== 1) {
              throw new RuntimeException('Final protocol lost its existing attachment relation.');
          }

          $detachRejected = false;
          try {
              $service->detachDocumentFromRecord($documentId, $recordId);
          } catch (RuntimeException $exception) {
              $detachRejected = str_contains($exception->getMessage(), 'immutable');
          }
          if (!$detachRejected) {
              throw new RuntimeException('Final protocol allowed attachment detach.');
          }

          $attachRejected = false;
          try {
              $service->attachDocumentToRecord($documentId, $recordId);
          } catch (RuntimeException $exception) {
              $attachRejected = str_contains($exception->getMessage(), 'immutable');
          }
          if (!$attachRejected) {
              throw new RuntimeException('Final protocol allowed attachment attach.');
          }

          $relationCount = (int) $db->setQuery(
              $db->getQuery(true)
                  ->select('COUNT(*)')
                  ->from($db->quoteName('#__decarodocuments_relations'))
                  ->where($db->quoteName('document_id') . ' = ' . $documentId)
                  ->where($db->quoteName('target_component') . ' = ' . $db->quote('com_decaroprotocol'))
                  ->where($db->quoteName('target_entity') . ' = ' . $db->quote('record'))
                  ->where($db->quoteName('target_id') . ' = ' . $db->quote((string) $recordId))
          )->loadResult();
          if ($relationCount !== 1) {
              throw new RuntimeException('Final protocol attachment relation was unexpectedly changed.');
          }

          echo "Protocol/Documents runtime attach/read/immutability OK\n";
          PHP
          php protocol-documents-probe.php
          rm protocol-documents-probe.php
