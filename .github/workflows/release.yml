name: Release Protocol package

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, simplexml
          coverage: none
      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 1
          fi
      - name: Validate release metadata and boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$VERSION" = '1.5.0'
          find component plugins package tools tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          while IFS= read -r -d '' FILE; do
            php -r 'libxml_use_internal_errors(true); if (simplexml_load_file($argv[1]) === false) exit(1);' "$FILE"
          done < <(find component plugins package updates -type f -name '*.xml' -print0)
          php -r '$c=simplexml_load_file("component/decaroprotocol.xml"); $p=simplexml_load_file("plugins/xdecaroanalytics/decaroprotocol/decaroprotocol.xml"); $pkg=simplexml_load_file("package/pkg_decaroprotocol.xml"); $u=simplexml_load_file("updates/pkg_decaroprotocol.xml"); foreach([$c,$p,$pkg,$u->update] as $x){if(trim((string)$x->version)!==$argv[1]) exit(1);}' "$VERSION"
          test -f "component/admin/sql/updates/mysql/${VERSION}.sql"
          grep -F 'charset="utf8"' component/decaroprotocol.xml
          ! grep -F 'charset="utf8mb4"' component/decaroprotocol.xml
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql/updates/mysql
          grep -F "MINIMUM_CORE_VERSION = '1.4.0'" component/admin/src/Service/CoreIntegrationService.php
          grep -F 'CapabilityRegistry' component/admin/src/Service/CoreIntegrationService.php
          grep -F 'ProtocolComponent' component/admin/services/provider.php
          ! grep -RInE '#__(decarodocuments|xdecaronotifications|xdecarotasks|xdecaroanalytics)_' component/admin/src/Service
          php tests/documents-integration-contract.php
          php tests/public-integration-contract.php
      - name: Build deterministic packages
        run: |
          php tools/build.php
          cp dist/SHA256SUMS.txt /tmp/protocol-sums
          php tools/build.php
          diff -u /tmp/protocol-sums dist/SHA256SUMS.txt
          for file in dist/*.zip; do unzip -t "$file" >/dev/null; done
          unzip -l "dist/pkg_decaroprotocol_${VERSION}.zip" | grep -F "packages/com_decaroprotocol_${VERSION}.zip"
          unzip -l "dist/pkg_decaroprotocol_${VERSION}.zip" | grep -F "packages/plg_xdecaroanalytics_decaroprotocol_${VERSION}.zip"
          unzip -l "dist/pkg_decaroprotocol_${VERSION}.zip" | grep -F 'script.php'
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "dist/com_decaroprotocol_${VERSION}.zip" \
            "dist/plg_xdecaroanalytics_decaroprotocol_${VERSION}.zip" \
            "dist/pkg_decaroprotocol_${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Protocol by xdecaro ${VERSION}" \
            --notes "Protocol ${VERSION}: public component service facade, Core 1.4 capabilities, optional Notifications/Tasks API bridges and Protocol-owned Analytics provider. Existing numbering transactions, audit semantics and Documents attachment immutability are preserved; no cross-product private tables are consumed."
      - name: Publish package checksum
        shell: bash
        run: |
          set -euo pipefail
          export PACKAGE_SHA="$(sha256sum "dist/pkg_decaroprotocol_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('updates/pkg_decaroprotocol.xml')
          text = path.read_text()
          updated, count = re.subn(r'<sha256>[^<]*</sha256>', f'<sha256>{os.environ["PACKAGE_SHA"]}</sha256>', text, count=1)
          if count != 1:
              raise SystemExit('Protocol update feed SHA-256 tag was not found')
          path.write_text(updated)
          PY
          grep -F "<sha256>${PACKAGE_SHA}</sha256>" updates/pkg_decaroprotocol.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decaroprotocol.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Protocol ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
