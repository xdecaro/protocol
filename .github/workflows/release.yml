name: Release Protocol package

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Read version
        run: echo "VERSION=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_ENV"
      - name: Refuse existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists"
            exit 1
          fi
      - name: Validate release metadata Core Documents and SQL boundaries
        shell: bash
        run: |
          set -euo pipefail
          find component tools tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          while IFS= read -r -d '' FILE; do
            php -r 'libxml_use_internal_errors(true); if (simplexml_load_file($argv[1]) === false) { exit(1); }' "$FILE"
          done < <(find component package updates -type f -name '*.xml' -print0)
          php -r '$c=simplexml_load_file("component/decaroprotocol.xml"); $p=simplexml_load_file("package/pkg_decaroprotocol.xml"); $u=simplexml_load_file("updates/pkg_decaroprotocol.xml"); if (trim((string)$c->version) !== $argv[1] || trim((string)$p->version) !== $argv[1] || trim((string)$u->update->version) !== $argv[1]) { exit(1); }' "$VERSION"
          test -f "component/admin/sql/updates/mysql/${VERSION}.sql"
          grep -F 'charset="utf8"' component/decaroprotocol.xml
          ! grep -F 'charset="utf8mb4"' component/decaroprotocol.xml
          for table in registers register_counters records audit; do
            grep -F "CREATE TABLE IF NOT EXISTS \`#__decaroprotocol_${table}\`" "component/admin/sql/updates/mysql/${VERSION}.sql"
          done
          ! grep -RniE 'DROP[[:space:]]+TABLE|TRUNCATE[[:space:]]+TABLE' component/admin/sql/updates/mysql
          test -f component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'xdecaro\Core' component/admin/src/Service/CoreIntegrationService.php
          grep -F 'xdecaro\Core' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'xdecaro\Core' component/admin/src/Helper/InformationHelper.php
          ! grep -RInF 'Xdecaro\Core' component/admin/src component/admin/services
          ! grep -RInF '#__decarodocuments_' component
          ! grep -RInF 'com_decarodcl' component
          grep -F 'bootComponent(self::DOCUMENTS_COMPONENT)' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'getRelationService' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F 'assertRecordRelationsMutable' component/admin/src/Service/DocumentsIntegrationService.php
          grep -F "Session::checkToken('post')" component/admin/src/Controller/RecordController.php
          php tests/documents-integration-contract.php
      - name: Build deterministic packages
        run: |
          php tools/build.php
          cp dist/SHA256SUMS.txt /tmp/protocol-sums
          php tools/build.php
          diff -u /tmp/protocol-sums dist/SHA256SUMS.txt
          for file in dist/*.zip; do unzip -t "$file" >/dev/null; done
          unzip -p "dist/com_decaroprotocol_${VERSION}.zip" decaroprotocol.xml | grep -F 'charset="utf8"'
          unzip -l "dist/com_decaroprotocol_${VERSION}.zip" | grep -F 'admin/src/Service/DocumentsIntegrationService.php'
          unzip -l "dist/com_decaroprotocol_${VERSION}.zip" | grep -F "admin/sql/updates/mysql/${VERSION}.sql"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            "dist/com_decaroprotocol_${VERSION}.zip" \
            "dist/pkg_decaroprotocol_${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --title "Protocol by xdecaro ${VERSION}" \
            --notes "Protocol ${VERSION} exposes the existing provider-owned Documents relation contract in the Protocol record editor. Saved drafts can link or unlink existing Documents records; definitive protocols keep their linked attachments readable/downloadable but reject relation changes server-side. Write tasks require Joomla CSRF validation, Protocol keeps record ACL/state ownership, Documents keeps document ACL/storage/relation persistence, and no private Documents tables are consumed by Protocol."
      - name: Publish package checksum
        shell: bash
        run: |
          set -euo pipefail
          export PACKAGE_SHA="$(sha256sum "dist/pkg_decaroprotocol_${VERSION}.zip" | awk '{print $1}')"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('updates/pkg_decaroprotocol.xml')
          text = path.read_text()
          updated, count = re.subn(r'<sha256>[^<]*</sha256>', f'<sha256>{os.environ["PACKAGE_SHA"]}</sha256>', text, count=1)
          if count != 1:
              raise SystemExit('Protocol update feed SHA-256 tag was not found')
          path.write_text(updated)
          PY
          grep -F "<sha256>${PACKAGE_SHA}</sha256>" updates/pkg_decaroprotocol.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decaroprotocol.xml
          git diff --cached --quiet || git commit -m "Publish SHA-256 for Protocol ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
